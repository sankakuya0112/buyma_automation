<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>BUYMA Auto Lister</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>BUYMA Auto Lister</h1>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="products">商品</button>
        <button class="tab-btn" data-tab="scrape">取得</button>
        <button class="tab-btn" data-tab="settings">設定</button>
      </nav>
    </header>

    <!-- 商品タブ -->
    <section id="tab-products" class="tab-pane active">
      <div class="toolbar">
        <span id="product-count">0 件</span>
        <button id="btn-clear" class="secondary">全削除</button>
      </div>
      <div id="product-list" class="product-list"></div>
    </section>

    <!-- 取得タブ -->
    <section id="tab-scrape" class="tab-pane">
      <p class="note">
        baseblu.com の商品詳細ページで「現在のページを取得」を押すか、
        一覧ページで「一覧から一括取得」を押してください。
      </p>
      <button id="btn-scrape-current" class="primary">現在のページを取得</button>
      <button id="btn-scrape-list" class="secondary">一覧から一括取得</button>
      <div id="scrape-log" class="log"></div>
    </section>

    <!-- 設定タブ -->
    <section id="tab-settings" class="tab-pane">
      <label>為替レート（EUR→JPY）
        <input type="number" id="cfg-exchangeRate" step="0.1" />
      </label>
      <label>目標利益率（%）
        <input type="number" id="cfg-targetMarginPct" step="0.1" />
      </label>
      <label>最低利益額（JPY）
        <input type="number" id="cfg-minProfitJpy" step="100" />
      </label>
      <label>国際配送料（EUR）
        <input type="number" id="cfg-shippingCostEur" step="1" />
      </label>
      <label>BUYMA 手数料率
        <input type="number" id="cfg-buymaCommissionRate" step="0.001" />
      </label>
      <button id="btn-save-settings" class="primary">設定を保存</button>
      <p id="settings-status" class="status"></p>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
